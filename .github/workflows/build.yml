name: build and benchmark

# Wylde's first principle: "lean is a feature, not a trade-off. A release that
# regresses is rejected." So CI does not only build — it boots what it built and
# refuses to pass if the system got slower or fatter.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  base:
    name: sources and port tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ make bison flex m4 texinfo patch perl \
            python3 xz-utils bzip2 wget curl git ca-certificates

      - name: every archive the build unpacks is part of the pinned sources
        # catches a renamed tarball before a three-hour build does
        run: python3 tools/check-build-sources.py

      - name: every source in the tree is downloadable and intact
        # stronger than a local file check: proves every URL is alive and every
        # checksum still matches upstream
        run: |
          mkdir -p /tmp/wylde-sources
          python3 tools/gen-ports.py ports.spec --fetch --fetch-dir /tmp/wylde-sources

      - name: every Pkgfile parses
        working-directory: wld
        run: |
          cargo build --release
          WLD_ROOT=$PWD/testroot ./target/release/wld ports | wc -l

      - name: wld unit tests
        working-directory: wld
        run: cargo test

  build:
    name: build the system and measure it
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils bison flex gawk m4 texinfo wget curl git ca-certificates \
            gcc g++ make xz-utils bzip2 file \
            qemu-system-x86 musl-tools musl-dev cpio \
            rsync e2fsprogs util-linux

      # GitHub runners are virtualised: swapon is rejected by the hypervisor, so
      # there is no swap to add. The build is limited with MAKEFLAGS instead.
      - name: limit compiler parallelism
        run: echo "MAKEFLAGS=-j2" >> "$GITHUB_ENV"

      - name: caches
        uses: actions/cache@v4
        with:
          path: |
            /mnt/lfs/sources
            /mnt/lfs/var/lib/wld/sources
          key: sources-${{ hashFiles('build/*.sh', 'sources*.txt') }}
          restore-keys: sources-

      - name: prepare the host (lfs user, layout, verified sources)
        run: sudo ./build/00-bootstrap-host.sh

      - name: build the base system (LFS 12.4)
        # root: the build mounts /proc, /sys and /dev into the target and su's
        # to the lfs user. -E keeps LFS, LOGDIR and MAKEFLAGS.
        run: sudo -E ./build/all.sh
        env:
          LFS: /mnt/lfs
          LOGDIR: /tmp/wylde-build

      - name: show the build log when something fails
        if: failure()
        run: |
          tail -n 200 /tmp/wylde-build/build.log || true
          for log in /tmp/wylde-build/*.log; do
            echo "=== $log"
            tail -n 40 "$log"
          done

      - name: keep the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/wylde-build

      - name: build wld
        working-directory: wld
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo test
          cargo build --release --target x86_64-unknown-linux-musl
          sudo mkdir -p /mnt/lfs/usr/local/bin
          sudo install -m755 target/x86_64-unknown-linux-musl/release/wld \
            /mnt/lfs/usr/local/bin/wld

      - name: build the initramfs
        run: |
          sudo apt-get install -y busybox-static
          ./scripts/make-initramfs.sh

      - name: build the disk image
        run: sudo ./scripts/make-disk-image.sh /mnt/wylde/wylde.img

      - name: boot it
        # a boot that reaches the login prompt is the real unit of trust
        run: sudo ./scripts/boot-test.sh /mnt/wylde/wylde.img

      - name: measure boot time and idle memory
        run: |
          sudo ./scripts/benchmark.sh \
            /mnt/wylde/wylde.img \
            /mnt/lfs/boot/vmlinuz-6.16.1-lfs-12.4 \
            benchmark.json
          cat benchmark.json

      - name: enforce the lean budget
        # boot seconds are only compared against the baseline when both runs
        # used the same accelerator (KVM vs TCG are not comparable)
        run: python3 tools/check-regression.py benchmark.json benchmarks/baseline.json

      - name: publish the disk image
        uses: actions/upload-artifact@v4
        with:
          name: wylde-image
          path: |
            /mnt/wylde/wylde.img
            benchmark.json

  installer:
    name: installer and doctor
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc musl-tools musl-dev curl rsync shellcheck

      - name: installer is valid and refuses to run unattended
        # 16-installer.sh also proves the installer stops without a human at the
        # keyboard rather than guessing which disk to erase
        run: ./build/16-installer.sh

      - name: wylde-doctor builds static and passes its tests
        run: ./build/17-doctor.sh

      - name: doctor runs on this machine and reports
        # it must work on a non-Wylde host too: no /proc surprises, no crash
        run: |
          ./target/wylde-doctor | head -20
          ./target/wylde-doctor memory
          ./target/wylde-doctor services